<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080a">
  <title>Boo AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        radial-gradient(
          circle at top,
          #38206d 0%,
          #151022 38%,
          #050507 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 650px;
      height: 100vh;

      display: flex;
      flex-direction: column;

      background: rgba(8, 8, 12, 0.92);

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 0 60px rgba(130,70,255,0.28);
    }

    .topbar {
      min-height: 78px;

      display: flex;
      align-items: center;

      padding: 12px 18px;

      border-bottom:
        1px solid rgba(255,255,255,0.1);

      background:
        rgba(20,15,35,0.92);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;

      border-radius: 50%;

      object-fit: cover;

      background: #191421;

      border: 2px solid #b98cff;

      box-shadow:
        0 0 18px rgba(170,100,255,0.55);
    }

    .brand-name {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-sub {
      font-size: 12px;
      color: #b9aecb;
      margin-top: 3px;
    }

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .message {
      max-width: 85%;

      padding: 13px 16px;

      border-radius: 16px;

      line-height: 1.45;

      white-space: pre-wrap;

      word-wrap: break-word;
    }

    .boo {
      align-self: flex-start;

      background: #17121f;

      border:
        1px solid rgba(190,140,255,0.22);
    }

    .user {
      align-self: flex-end;

      background: #30205a;

      border:
        1px solid rgba(190,140,255,0.25);
    }

    .error {
      align-self: flex-start;

      background: #32141a;

      border:
        1px solid rgba(255,100,120,0.3);
    }

    .composer {
      display: flex;

      gap: 10px;

      padding: 14px;

      border-top:
        1px solid rgba(255,255,255,0.1);

      background:
        rgba(15,12,22,0.95);
    }

    #message {
      flex: 1;

      min-width: 0;
      min-height: 48px;
      max-height: 140px;

      resize: none;

      border:
        1px solid rgba(255,255,255,0.15);

      border-radius: 14px;

      padding: 13px;

      color: white;

      background: #0d0b12;

      outline: none;

      font-size: 16px;
    }

    #message:focus {
      border-color: #a874ff;

      box-shadow:
        0 0 12px rgba(168,116,255,0.15);
    }

    #send {
      border: 0;

      border-radius: 14px;

      padding: 0 20px;

      background: #8b5cf6;

      color: white;

      font-weight: 700;

      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      opacity: 0.65;
      font-style: italic;
    }

    @media (max-width: 650px) {
      #app {
        max-height: none;
        border: none;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <header class="topbar">
    <div class="brand">

      <img
        class="avatar"
        src="avatar.png"
        onerror="this.style.display='none'"
        alt="Boo"
      >

      <div>
        <div class="brand-name">Boo</div>
        <div class="brand-sub">AI Assistant</div>
      </div>

    </div>
  </header>

  <main id="messages">

    <div class="message boo">
      Hey. I'm Boo. What's up?
    </div>

  </main>

  <form class="composer" id="chatForm">

    <textarea
      id="message"
      rows="1"
      placeholder="Talk to Boo..."
      autocomplete="off"
    ></textarea>

    <button id="send" type="submit">
      Send
    </button>

  </form>

</div>

<script>

const WORKER_URL =
  "https://boo-a-iz.dainx-a-i-8.workers.dev;

const form =
  document.getElementById("chatForm");

const input =
  document.getElementById("message");

const send =
  document.getElementById("send");

const messages =
  document.getElementById("messages");


function addMessage(text, type) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

  return div;
}


form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    const message =
      input.value.trim();

    if (!message) {
      return;
    }

    addMessage(message, "user");

    input.value = "";

    send.disabled = true;
    input.disabled = true;

    const typing =
      addMessage(
        "Boo is thinking...",
        "boo typing"
      );

    try {

      const response =
        await fetch(
          WORKER_URL + "/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                message: message
              })
          }
        );

      const data =
        await response.json();

      typing.remove();

      if (!response.ok) {

        addMessage(
          data?.error ||
          "Boo couldn't respond.",
          "error"
        );

        return;
      }

      addMessage(
        data?.response ||
        "Boo didn't have a response.",
        "boo"
      );

    } catch (error) {

      typing.remove();

      addMessage(
        "Boo couldn't connect right now.",
        "error"
      );

    } finally {

      send.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }
);


input.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      form.requestSubmit();
    }
  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height = "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        140
      ) + "px";
  }
);

</script>

</body>
</html>
